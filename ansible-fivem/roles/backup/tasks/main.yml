- name: Create backup script
  copy:
    dest: /usr/local/bin/backup_fivem.sh
    content: |
      #!/bin/bash
      tar czf /var/backups/fivem_$(date +%F).tar.gz /home/fivemuser/server-data
      mysqldump -u fivemuser -p'secure_password' fivem > /var/backups/fivem_db_$(date +%F).sql
    mode: "0755"

- name: Add cron job for daily backup
  cron:
    name: "Daily FXServer backup"
    user: root
    job: "/usr/local/bin/backup_fivem.sh"
    minute: 0
    hour: 3
